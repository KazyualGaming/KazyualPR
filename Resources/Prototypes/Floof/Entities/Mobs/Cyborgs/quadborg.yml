- type: entity
  id: BorgChassisQuadSelectable
  parent: BaseBorgChassisNT
  components:
  - type: Body
    prototype: Quadborg
  - type: Inventory
    speciesId: quadborg
    templateId: borgquad 
  - type: Sprite
    sprite: Floof/Mobs/Silicon/quad.rsi
    scale: 0.7, 0.7
    layers:
    - state: quadsprite
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: quadspritel
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: quadspriter
      shader: unshaded
      map: ["light", "enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: quadsprite_moving
    noMovementLayers:
      movement:
        state: quadsprite
  - type: Strap # HardLight: Enables buckling to borgs
    blacklist: # HardLight: Stop crashing the damned clients and server!
      components:
      - BorgChassis
    position: Stand
    buckleOffset: "0,-0.2"
    buckleSelfDoafterTime: 4.5 # people attempting to buckle to the borg will have a doafter
  - type: LockingWhitelist
    blacklist:
      components:
      - RoboticsConsole
  - type: Sanitized
  - type: ComplexInteraction
  - type: BorgChassis
    maxModules: 0
    hasMindState: quadspritel
    noMindState: quadspriter
  - type: BorgTransponder
    sprite:
      sprite: Floof/Mobs/Silicon/quad.rsi
      state: quadsprite
    name: cyborg
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5         # Vanilla Borgs have 2.5
    baseSprintSpeed: 5.5       # Vanilla Borgs have 4.5
  - type: BorgSwitchableType
    chassisFamily: quad
    inherentRadioChannels:
    - Common
    - Binary
  - type: Speech
    speechVerb: Robotic
  - type: LayingDown
  - type: InteractionPopup 
    interactSuccessString: petting-success-generic-cyborg
    interactFailureString: petting-failure-generic-cyborg
    interactSuccessSound:
      path: /Audio/Ambience/Objects/periodic_beep.ogg

- type: entity
  id: BorgChassisQuad
  parent: BorgChassisQuadSelectable
  name: generic quadborg
  suffix: type picked
  components:
  - type: BorgSwitchableType
    selectedBorgType: genericQuad

- type: entity
  id: BorgChassisQuadEngineer
  parent: BorgChassisQuadSelectable
  name: engineer quadborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: engineeringQuad

- type: entity
  id: BorgChassisQuadsalv
  parent: BorgChassisQuadSelectable
  name: salvage quadborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: miningQuad

- type: entity
  id: BorgChassisQuadserv
  parent: BorgChassisQuadSelectable
  name: service quadborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: serviceQuad

- type: entity
  id: BorgChassisQuadmed
  parent: [BorgChassisQuadSelectable, ShowMedicalIcons]
  name: medical quadborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: medicalQuad

- type: entity
  id: SyndiQuad
  parent: [BorgChassisQuadSelectable, BaseBorgChassisSyndicate]
  components:
  - type: Sprite
    sprite: Floof/Mobs/Silicon/quad.rsi
    scale: 0.7, 0.7
    layers:
    - state: SyndQuad
      map: ["movement"]
    - state: SyndQuadl
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: SyndQuadr
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: SyndQuad_moving
    noMovementLayers:
      movement:
        state: SyndQuad
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: BorgChassis
    maxModules: 8
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - BorgModuleSecurity
      - BorgModuleMedical
      - BorgModuleSyndicate
      - BorgModuleSyndicateAssault
      - XenoborgModuleGeneric
    hasMindState: SyndQuadl
    noMindState: SyndQuadr
  - type: Access 
    tags: 
    - SyndicateAgent 
    - NuclearOperative 
  - type: AccessReader
    access: [["NuclearOperative"], ["SyndicateAgent"]]
  - type: BorgTransponder
    sprite:
      sprite: Floof/Mobs/Silicon/quad.rsi
      state: SyndQuad
    name: cyborg

