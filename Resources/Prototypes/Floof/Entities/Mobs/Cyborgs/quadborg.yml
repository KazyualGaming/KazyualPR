- type: entity
  parent: [ BaseXenoborgChassis, BaseXenoborgTransponder ]
  id: Xenoquad
  name: Quad Xenoborg
  suffix: with brain
  description: A man-machine hybrid that aims to replicate itself. They love extracting brains to insert into fresh Xenoborg chassis to grow their army. This one seems to have 4 legs and additional assets.
  components:
  - type: Construction
    node: start
  - type: BorgTransponder
    name: Quad xenoborg
    sprite:
      sprite: Floof/Mobs/Silicon/quad.rsi
      state: XenoQuad
  - type: BorgChassis
    maxModules: 10
    hasMindState: XenoQuad_e
    noMindState: XenoQuad_e_r
    moduleWhitelist:
      tags:
      - BorgModuleGeneric
      - XenoborgModuleGeneric
      - BorgModuleSecurity
      - BorgModuleSyndicate
      - BorgModuleSyndicateAssault
      - BorgModuleMedical
      - BorgModuleEngineering
      - BorgModuleScience
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - XenoborgModuleBasic
      - BorgModuleConstruction
      - BorgModuleRCD
      - BorgModuleTool
      - BorgModuleAdvancedSurgery
      - BorgModuleOperative
      - XenoborgModuleFireExtinguisher
  - type: ShowHealthBars
    damageContainers:
    - Inorganic
    - Silicon
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: Sprite
    sprite: Floof/Mobs/Silicon/quad.rsi
    scale: 0.7, 0.7
    layers:
    - state: XenoQuad
      map: ["movement"]
    - state: XenoQuad_e
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: XenoQuad_e
      shader: unshaded
      map: ["light"]
      visible: false
  - type: SpriteMovement
    movementLayers:
      movement:
        state: XenoQuad_moving
    noMovementLayers:
      movement:
        state: XenoQuad