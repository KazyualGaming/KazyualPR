# Medical borg
- type: borgType
  id: medicalQuad
  chassisFamily: quad

  # Description
  dummyPrototype: BorgChassisQuadmed

  # Functional
  extraModuleCount: 1
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleTreatment
  - BorgModuleDefibrillator # Sandwich
  - BorgModuleSurgery # Sandwich

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological

  # Visual
  inventoryTemplateId: borgquad
  spriteBodyState: quadspritemed
  spriteBodyMovementState: quadspritemed_moving
  spriteHasMindState: quadspritemedl
  spriteNoMindState: quadspritemedr
  spriteToggleLightState: quadspritemedl

  # Pet
  petSuccessString: petting-success-medical-cyborg
  petFailureString: petting-failure-medical-cyborg
  

