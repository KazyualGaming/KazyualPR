# Generic Quadborg
- type: borgType
  id: genericQuad
  chassisFamily: quad

  # Description
  dummyPrototype: BorgChassisQuad

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleScience #until sciborgs are added

  defaultModules:
  - BorgModuleTool

  radioChannels:
  - Science

  # Visual
  inventoryTemplateId: borgquad
  spriteBodyState: quadsprite
  spriteBodyMovementState: quadsprite_moving
  spriteHasMindState: quadspritel
  spriteNoMindState: quadspriter
  spriteToggleLightState: quadspritel

  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg


