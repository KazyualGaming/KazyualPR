# Handles custom Hardlight borg armour-types
# For default chassis that require custom offsets so their armor looks correct
# Identical Currently, but will be expanded upon for things such as custom armor sprites, and unique per-chassis variants
# Think Dutchborgs.

- type: inventoryTemplate
  id: borgquad
  slots:
  - name: neck
    slotTexture: neck
    slotFlags: NECK
    uiWindowPos: 0,2
    strippingWindowPos: 0,1
    displayName: Neck
    whitelist:
      tags:
        - BorgWearable
  - name: armor
    slotTexture: suit_storage
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: head
    offset: 0, 0
    whitelist:
      tags:
        - BorgWearable



- type: inventoryTemplate
  id: borgHL
  slots:
  - name: armor
    slotTexture: suit_storage
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: head
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0.015625, -0.09375



